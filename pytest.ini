[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
testpaths = apps tests/check tests/e2e tests/fixtures tests/integration tests/unit tests/verification
addopts = -v --tb=short --strict-markers --disable-warnings --ignore=tests/manual_examples --reuse-db --ds=config.settings --asyncio-mode=auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ws: WebSocket related tests
env =
    DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver
